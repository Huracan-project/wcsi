# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # pyspharm imports NumPy while its wheel is being built, but does not
    # declare NumPy as a build dependency. Install it first and reuse the
    # Read the Docs environment for the package build.
    install:
      - python -m pip install --upgrade pip wheel
      - python -m pip install numpy
      - python -m pip install --no-build-isolation ".[docs]"
  apt_packages:
    - gfortran
    - libgeos-dev
    - libproj-dev
    - libudunits2-dev
    - proj-bin
    - proj-data

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
