[project]
name = "wcsi"
version = "2.1.0"
dependencies = [
    "cartopy",
    "cf_units",
    "cyclopts",
    "huracanpy",
    "matplotlib",
    "matplotlib-venn",
    "numpy",
    "pandas",
    "python-dateutil",
    "scipy",
    "scitools-iris",
    "tqdm",
    "xarray"
]

[project.optional-dependencies]
test = ["pytest"]
docs = [
    "IPython",
    "ipykernel",
    "myst-parser",
    "nbsphinx",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]

[project.scripts]
wcsi = "wcsi.scripts.wcsi:app"

[tool.ruff.lint]
ignore = ["I001", "C408", "DTZ001", "RUF022"]

[tool.pyrefly]
project-includes = ["**/*.py*"]
